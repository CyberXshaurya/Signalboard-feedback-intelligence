<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
<title id="title">Signalboard reviewer workflow</title><desc id="desc">Eight-stage workflow from feedback upload to immutable report.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f6f1"/><stop offset="1" stop-color="#ede7c9"/></linearGradient><style>.flow{stroke-dasharray:13 11;animation:move 7s linear infinite}@keyframes move{to{stroke-dashoffset:-192}}</style></defs>
<rect width="1440" height="360" rx="34" fill="url(#bg)"/>
<text x="52" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#252822">Reviewer workflow</text>
<text x="52" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#62665f">Every AI conclusion remains traceable to persisted feedback.</text>
<path d="M120 202H1320" stroke="#a7ab9f" stroke-width="4" class="flow"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <g transform="translate(70 150)"><circle cx="50" cy="50" r="46" fill="#262924"/><text x="50" y="46" text-anchor="middle" font-size="14" font-weight="800" fill="#ffd64a">01</text><text x="50" y="67" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">Upload</text></g>
  <g transform="translate(235 150)"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#d3d8cf"/><text x="50" y="46" text-anchor="middle" font-size="14" font-weight="800" fill="#7d6b19">02</text><text x="50" y="67" text-anchor="middle" font-size="14" font-weight="800" fill="#252822">Validate</text></g>
  <g transform="translate(400 150)"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#d3d8cf"/><text x="50" y="46" text-anchor="middle" font-size="14" font-weight="800" fill="#7d6b19">03</text><text x="50" y="67" text-anchor="middle" font-size="14" font-weight="800" fill="#252822">Cluster</text></g>
  <g transform="translate(565 150)"><circle cx="50" cy="50" r="46" fill="#fff7cf" stroke="#e5d57c"/><text x="50" y="46" text-anchor="middle" font-size="14" font-weight="800" fill="#7d6b19">04</text><text x="50" y="67" text-anchor="middle" font-size="14" font-weight="800" fill="#252822">Synthesize</text></g>
  <g transform="translate(730 150)"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#d3d8cf"/><text x="50" y="46" text-anchor="middle" font-size="14" font-weight="800" fill="#7d6b19">05</text><text x="50" y="67" text-anchor="middle" font-size="14" font-weight="800" fill="#252822">Ground</text></g>
  <g transform="translate(895 150)"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#d3d8cf"/><text x="50" y="46" text-anchor="middle" font-size="14" font-weight="800" fill="#7d6b19">06</text><text x="50" y="67" text-anchor="middle" font-size="14" font-weight="800" fill="#252822">Measure</text></g>
  <g transform="translate(1060 150)"><circle cx="50" cy="50" r="46" fill="#e6ece5" stroke="#ccd5cc"/><text x="50" y="46" text-anchor="middle" font-size="14" font-weight="800" fill="#546056">07</text><text x="50" y="67" text-anchor="middle" font-size="14" font-weight="800" fill="#252822">Review</text></g>
  <g transform="translate(1225 150)"><circle cx="50" cy="50" r="46" fill="#ffd64a"/><text x="50" y="46" text-anchor="middle" font-size="14" font-weight="800" fill="#514a27">08</text><text x="50" y="67" text-anchor="middle" font-size="14" font-weight="800" fill="#252822">Publish</text></g>
</g>
<text x="70" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#666b63">CSV</text><text x="235" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#666b63">schema + rows</text><text x="400" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#666b63">similarity</text><text x="565" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#666b63">AI output</text><text x="730" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#666b63">evidence IDs</text><text x="895" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#666b63">deterministic</text><text x="1060" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#666b63">human actions</text><text x="1225" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#666b63">snapshot</text>
</svg>
