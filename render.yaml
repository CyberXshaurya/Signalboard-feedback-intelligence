services:
  - type: web
    name: signalboard-feedback-intelligence
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: feedback-intelligence-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: REQUIRE_USER_HEADER
        value: "true"
      - key: SYNTHESIS_PROVIDER
        value: auto
      - key: EMBEDDING_PROVIDER
        value: tfidf
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_MODEL
        value: openai/gpt-4.1-mini
      - key: GITHUB_API_VERSION
        value: "2026-03-10"
      - key: CORS_ORIGINS
        value: ""
      - key: MAX_CSV_ROWS
        value: "5000"
      - key: MAX_UPLOAD_BYTES
        value: "10000000"

  # Render Free Postgres is suitable for the assignment review window.
  # It expires 30 days after creation; upgrade or migrate for ongoing production use.
databases:
  - name: feedback-intelligence-db
    plan: free
    databaseName: feedback
    user: feedback
