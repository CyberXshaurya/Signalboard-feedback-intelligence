[project]
name = "feedback-intelligence-engine"
version = "2.0.0"
description = "Evidence-grounded AI product feedback synthesis engine"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "python-dateutil>=2.9,<3.0",
  "scikit-learn>=1.5,<2.0",
  "numpy>=2.0,<3.0",
  "networkx>=3.3,<4.0",
  "httpx>=0.27,<1.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
openai = ["openai>=2.0,<3.0"]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
  "playwright>=1.50,<2.0",
  "pillow>=11.0,<13.0",
]

[project.scripts]
feedback-engine = "feedback_intelligence_engine.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
feedback_intelligence_engine = ["web/*"]

[tool.pytest.ini_options]
markers = ["ui: real browser interaction tests"]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
